[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-state-estimation-starter"
version = "0.1.0"
description = "Modular research framework for vehicle state estimation experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "h5py>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
fg = ["gtsam>=4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
